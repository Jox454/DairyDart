<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mood Entry - MindDiary</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary": "#adc6ff",
                    "primary-fixed-dim": "#d0bcff",
                    "primary": "#d0bcff",
                    "outline-variant": "#494454",
                    "tertiary": "#ffafd3",
                    "surface-bright": "#303a48",
                    "tertiary-fixed": "#ffd8e7",
                    "on-error-container": "#ffdad6",
                    "on-tertiary-container": "#560038",
                    "surface": "#091421",
                    "on-surface-variant": "#cbc3d7",
                    "secondary-container": "#0566d9",
                    "on-primary": "#3c0091",
                    "surface-container": "#16202e",
                    "on-primary-container": "#340080",
                    "on-surface": "#d9e3f6",
                    "on-tertiary": "#620040",
                    "inverse-on-surface": "#27313f",
                    "error-container": "#93000a",
                    "surface-container-low": "#121c2a",
                    "inverse-primary": "#6d3bd7",
                    "on-error": "#690005",
                    "on-secondary-fixed-variant": "#004395",
                    "surface-container-high": "#212b39",
                    "secondary-fixed": "#d8e2ff",
                    "primary-container": "#a078ff",
                    "on-secondary-container": "#e6ecff",
                    "primary-fixed": "#e9ddff",
                    "error": "#ffb4ab",
                    "surface-container-lowest": "#050f1c",
                    "surface-tint": "#d0bcff",
                    "on-tertiary-fixed": "#3d0026",
                    "on-secondary": "#002e6a",
                    "on-primary-fixed": "#23005c",
                    "on-secondary-fixed": "#001a42",
                    "tertiary-container": "#e364a7",
                    "tertiary-fixed-dim": "#ffafd3",
                    "inverse-surface": "#d9e3f6",
                    "on-background": "#d9e3f6",
                    "surface-dim": "#091421",
                    "surface-container-highest": "#2b3544",
                    "on-tertiary-fixed-variant": "#85145a",
                    "secondary-fixed-dim": "#adc6ff",
                    "on-primary-fixed-variant": "#5516be",
                    "background": "#091421",
                    "surface-variant": "#2b3544",
                    "outline": "#958ea0"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "64px",
                    "lg": "32px",
                    "xs": "8px",
                    "gutter": "16px",
                    "md": "24px",
                    "margin-mobile": "20px",
                    "xl": "48px",
                    "sm": "16px",
                    "base": "4px"
            },
            "fontFamily": {
                    "body-md": ["Manrope"],
                    "label-sm": ["Manrope"],
                    "headline-xl": ["Plus Jakarta Sans"],
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Manrope"],
                    "body-lg": ["Manrope"],
                    "headline-lg-mobile": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["22px", {"lineHeight": "28px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .glass-panel {
            background: rgba(31, 41, 55, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .mood-shadow {
            box-shadow: 0 4px 14px rgba(139, 92, 246, 0.15);
        }
        .active-mood {
            transform: scale(1.1);
            background: #d0bcff;
            color: #3c0091;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #494454;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary/30 min-h-screen pb-32">
<!-- Header Section -->
<header class="fixed top-0 left-0 w-full z-50 bg-background/80 backdrop-blur-md px-margin-mobile h-16 flex items-center">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</header>
<main class="pt-20 px-margin-mobile space-y-md max-w-lg mx-auto">
<!-- Mood Section -->
<section class="space-y-sm text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">How do you feel?</h1>
<div class="flex justify-between items-center py-sm">
<button class="mood-btn flex flex-col items-center gap-base transition-all" onclick="selectMood(this)">
<div class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary mood-shadow active:scale-90">
<span class="material-symbols-outlined text-3xl">sentiment_very_satisfied</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Super</span>
</button>
<button class="mood-btn flex flex-col items-center gap-base transition-all" onclick="selectMood(this)">
<div class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary mood-shadow active:scale-90">
<span class="material-symbols-outlined text-3xl">sentiment_satisfied</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Good</span>
</button>
<button class="mood-btn flex flex-col items-center gap-base transition-all" onclick="selectMood(this)">
<div class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary mood-shadow active:scale-90">
<span class="material-symbols-outlined text-3xl">sentiment_neutral</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Neutral</span>
</button>
<button class="mood-btn flex flex-col items-center gap-base transition-all" onclick="selectMood(this)">
<div class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary mood-shadow active:scale-90">
<span class="material-symbols-outlined text-3xl">sentiment_dissatisfied</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Bad</span>
</button>
<button class="mood-btn flex flex-col items-center gap-base transition-all" onclick="selectMood(this)">
<div class="w-12 h-12 rounded-full glass-panel flex items-center justify-center text-primary mood-shadow active:scale-90">
<span class="material-symbols-outlined text-3xl">sentiment_very_dissatisfied</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Awful</span>
</button>
</div>
</section>
<!-- Activities Section -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant">Activities</h2>
<div class="grid grid-cols-4 gap-gutter">
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-secondary-fixed-dim">
<span class="material-symbols-outlined">family_restroom</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Family</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined">group</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Friends</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-error">
<span class="material-symbols-outlined">favorite</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Date</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">fitness_center</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Sport</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-primary-fixed-dim">
<span class="material-symbols-outlined">work</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Work</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-tertiary-fixed-dim">
<span class="material-symbols-outlined">movie</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Movie</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">shopping_basket</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Shop</span>
</button>
<button class="activity-chip flex flex-col items-center gap-xs p-2 rounded-xl transition-all" onclick="toggleChip(this)">
<div class="w-12 h-12 rounded-xl glass-panel flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">more_horiz</span>
</div>
<span class="text-label-sm font-label-sm text-on-surface-variant">Other</span>
</button>
</div>
</section>
<!-- Note Section -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant">Note</h2>
<div class="glass-panel rounded-xl p-sm focus-within:ring-2 focus-within:ring-primary transition-shadow">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-body-md text-on-surface placeholder:text-outline-variant resize-none" placeholder="Add a note..." rows="3"></textarea>
</div>
</section>
<!-- Photo Section -->
<section class="space-y-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant">Photo</h2>
<div class="grid grid-cols-2 gap-sm">
<button class="flex items-center justify-center gap-xs h-12 glass-panel rounded-xl text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined">photo_camera</span>
<span class="text-label-md font-label-md">Take a photo</span>
</button>
<button class="flex items-center justify-center gap-xs h-12 glass-panel rounded-xl text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined">image</span>
<span class="text-label-md font-label-md">From gallery</span>
</button>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full p-lg flex flex-col items-center bg-gradient-to-t from-background via-background/90 to-transparent">
<button class="group flex flex-col items-center gap-base transition-transform active:scale-90">
<div class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-[0_0_20px_rgba(208,188,255,0.3)] group-hover:shadow-[0_0_30px_rgba(208,188,255,0.5)] transition-shadow">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="text-label-md font-label-md text-primary uppercase tracking-widest">Save</span>
</button>
</footer>
<!-- Background Decorative Element -->
<div class="fixed top-1/4 -right-20 w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-1/4 -left-20 w-64 h-64 bg-secondary/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<script>
        function selectMood(element) {
            const btns = document.querySelectorAll('.mood-btn .w-12');
            btns.forEach(btn => {
                btn.classList.remove('bg-primary', 'text-on-primary', 'scale-110');
                btn.classList.add('glass-panel', 'text-primary');
            });
            
            const iconContainer = element.querySelector('.w-12');
            iconContainer.classList.remove('glass-panel', 'text-primary');
            iconContainer.classList.add('bg-primary', 'text-on-primary', 'scale-110');
            
            // Subtle haptic feel
            if (window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        function toggleChip(element) {
            const inner = element.querySelector('.w-12');
            const isActive = inner.classList.contains('ring-2');
            
            if (isActive) {
                inner.classList.remove('ring-2', 'ring-primary', 'bg-primary/20');
            } else {
                inner.classList.add('ring-2', 'ring-primary', 'bg-primary/20');
            }
        }
    </script>
</body></html>
