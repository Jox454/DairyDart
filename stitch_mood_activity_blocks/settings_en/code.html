<body class="font-body-md text-on-surface">
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 bg-background/80 dark:bg-background/80 backdrop-blur-md flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-primary" data-icon="calendar_month">calendar_month</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary font-bold">MindDiary</h1>
<button class="active:scale-95 transition-transform hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-20 px-margin-mobile max-w-lg mx-auto pb-4">
<!-- Profile Header Section -->
<section class="flex flex-col items-center mb-lg">
<div class="relative w-24 h-24 mb-md">
<div class="w-full h-full rounded-full border-4 border-primary-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a calm woman with a gentle smile, soft cinematic lighting illuminating her face against a dark, moody charcoal background. The aesthetic is clean, modern, and high-end corporate, with vibrant purple color grading that matches a mental health application's premium identity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAYCIgQB4AuFw-FmwRmT9lKxAaTbqZailPOh0ySDE5RZO_8jfxuxwantzMduXxo6FqPx84dupNWX3dnIH9k9mMbEOoUusqcbc61parGIJ4ecvOgLV4zWNI5ADNYmOoQqBqr7DjRZn3ACRjQPMV_Sb-emE-3VK0VeZcvCQA887CHLVWZUT0Sz1d1ABgBRQ6wI4WZAwrka24PIZVTG51hdeThNMHLRvsRYa8I6O2SBOd5-XecKGusmHA">
</div>
<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container p-1 rounded-full shadow-lg border-2 border-background">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Alex Johnson</h2>
<p class="font-label-md text-label-md text-on-surface-variant">Inner Peace Seeker</p>
</section>
<!-- Stats Bento Row -->
<div class="grid grid-cols-2 gap-sm mb-lg">

<div class="glass-card p-md rounded-xl flex flex-col gap-xs">


</div>
</div>
<!-- Menu Items -->
<div class="space-y-2 mb-lg">
<!-- Goals -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="ads_click">ads_click</span>
</div>
<span class="font-label-md text-label-md">Goals</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Weekly Reports -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-secondary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" data-icon="data_thresholding">data_thresholding</span>
</div>
<span class="font-label-md text-label-md">Weekly Reports</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Important Days -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-tertiary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" data-icon="event_note">event_note</span>
</div>
<span class="font-label-md text-label-md">Important Days</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Photo Gallery -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface" data-icon="photo_library">photo_library</span>
</div>
<span class="font-label-md text-label-md">Photo Gallery</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Achievements -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-yellow-500/20 flex items-center justify-center">
<span class="material-symbols-outlined text-yellow-500" data-icon="military_tech">military_tech</span>
</div>
<span class="font-label-md text-label-md">Achievements</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Reminders (Toggle) -->
<div class="w-full flex items-center justify-between p-4 glass-card rounded-xl">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-container" data-icon="notifications_active">notifications_active</span>
</div>
<span class="font-label-md text-label-md">Reminders</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox">
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
<!-- Edit Moods -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="sentiment_satisfied">sentiment_satisfied</span>
</div>
<span class="font-label-md text-label-md">Edit Moods</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Edit Activities -->
<button class="w-full flex items-center justify-between p-4 glass-card rounded-xl active:scale-[0.98] transition-transform">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="fitness_center">fitness_center</span>
</div>
<span class="font-label-md text-label-md">Edit Activities</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Premium Banner -->
<div class="premium-gradient p-6 rounded-2xl shadow-lg relative overflow-hidden group active:scale-95 transition-transform mb-md">
<div class="relative z-10 flex flex-col gap-xs">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-white">Go Premium</h3>
<p class="text-sm text-white/90 max-w-[200px]">Unlock detailed insights, unlimited moods, and cloud backup.</p>
<button class="mt-xs bg-white text-primary-container font-bold px-4 py-2 rounded-lg text-sm self-start shadow-md hover:bg-white/90 transition-colors">Upgrade Now</button>
</div>
<span class="material-symbols-outlined absolute -right-4 -bottom-4 text-9xl text-white/10 rotate-12 group-hover:scale-110 transition-transform" data-icon="workspace_premium" style="font-variation-settings: &quot;FILL&quot; 1;">workspace_premium</span>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 pt-2 bg-surface-container/80 dark:bg-surface-container/80 backdrop-blur-md rounded-t-xl shadow-lg"><button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform">
<span class="material-symbols-outlined">mood</span>
<span class="font-label-md text-label-md">Mood</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform">
<span class="material-symbols-outlined">bar_chart</span>
<span class="font-label-md text-label-md">Stats</span>
</button><button class="flex items-center justify-center w-14 h-14 bg-primary text-on-primary rounded-full fab-glow active:scale-90 transition-transform -mt-8 border-4 border-surface-container">
  <span class="material-symbols-outlined text-[32px]">add</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-90 transition-transform">
<span class="material-symbols-outlined">edit_note</span>
<span class="font-label-md text-label-md">Journal</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1 active:scale-90 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button></nav>
<script>
        // Simple micro-interaction for list items
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('click', () => {
                // Flash effect
                card.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                setTimeout(() => {
                    card.style.backgroundColor = '';
                }, 200);
            });
        });
    </script>


</body></html>
